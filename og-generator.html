<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Image Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #ffffff;
            width: 1200px;
            height: 630px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Subtle Background Gradient Orbs */
        .glow-1 {
            position: absolute;
            top: -150px;
            left: -150px;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.15) 0%, rgba(147, 51, 234, 0) 70%);
            border-radius: 50%;
            z-index: 0;
        }

        .glow-2 {
            position: absolute;
            bottom: -200px;
            right: -100px;
            width: 900px;
            height: 900px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(59, 130, 246, 0) 70%);
            border-radius: 50%;
            z-index: 0;
        }

        /* Grid Pattern */
        .grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
            z-index: 1;
        }

        /* Content Container */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 80px 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            width: fit-content;
        }

        .badge-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
        }

        .badge-text {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #d1d5db;
        }

        h1 {
            font-size: 84px;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -2px;
            color: #ffffff;
            max-width: 900px;
            margin-top: 20px;
        }

        .highlight {
            background: linear-gradient(to right, #3b82f6, #9333ea);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 40px;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .name {
            font-size: 36px;
            font-weight: 600;
            color: #f3f4f6;
        }

        .title {
            font-size: 24px;
            color: #9ca3af;
            font-weight: 400;
        }

        .domain {
            font-size: 24px;
            color: #6b7280;
            font-weight: 500;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="glow-1"></div>
    <div class="glow-2"></div>
    <div class="grid"></div>

    <div class="content">
        <div class="top-section">
            <div class="badge">
                <div class="badge-dot"></div>
                <div class="badge-text">Available for new opportunities</div>
            </div>
            
            <h1>Building products<br>that <span class="highlight">shape the future.</span></h1>
        </div>

        <div class="bottom-section">
            <div class="profile-info">
                <div class="name">Prayansh Ratan</div>
                <div class="title">Senior Product Manager</div>
            </div>
            <div class="domain">
                prayanshratan.vercel.app
            </div>
        </div>
    </div>
</body>
</html>
